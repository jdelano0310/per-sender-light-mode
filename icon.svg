<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="frame">
      <rect x="1" y="1" width="62" height="62" rx="11"/>
    </clipPath>
    <!-- Dark half: right side of a soft S-curve, like a page wiping over -->
    <clipPath id="dark">
      <path d="M45,0 C33,0 40,24 32,32 C24,40 31,64 19,64 L64,64 L64,0 Z"/>
    </clipPath>
    <clipPath id="light">
      <path d="M45,0 C33,0 40,24 32,32 C24,40 31,64 19,64 L0,64 L0,0 Z"/>
    </clipPath>
    <!-- Email body: avatar, sender + subject, divider, text lines -->
    <g id="mail">
      <circle cx="14" cy="15" r="5.5"/>
      <rect x="23" y="10" width="31" height="4.5" rx="2.25"/>
      <rect x="23" y="17.5" width="20" height="3.5" rx="1.75"/>
      <rect x="9" y="27" width="46" height="1.5" rx="0.75" opacity="0.6"/>
      <rect x="9" y="33" width="46" height="4" rx="2"/>
      <rect x="9" y="40" width="38" height="4" rx="2"/>
      <rect x="9" y="47" width="44" height="4" rx="2"/>
      <rect x="9" y="54" width="26" height="4" rx="2"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="64" height="64" fill="#f3f3f6"/>
    <rect width="64" height="64" fill="#1e1d24" clip-path="url(#dark)"/>
    <use xlink:href="#mail" fill="#3a3a46" clip-path="url(#light)"/>
    <use xlink:href="#mail" fill="#d9d9e2" clip-path="url(#dark)"/>
  </g>
  <rect x="1" y="1" width="62" height="62" rx="11" fill="none" stroke="#7d7d8a" stroke-width="1.5"/>
</svg>
